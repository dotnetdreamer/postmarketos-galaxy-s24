[package]
name = "s24-remote"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "The phone's desktop in any browser, from anywhere: a tunnel, a door with a code, and the picture"
publish = false

[dependencies]
tokio = { version = "1.54", features = ["rt", "net", "io-util", "process", "time", "sync", "macros", "signal"] }
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
serde_json = "1.0.154"
libc = "0.2.191"
# The Wi-Fi door's HTTPS, its certificate, the password's hash (ring: C and assembly, so this
# builds on the phone, or wherever an aarch64 C compiler is)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
time = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
