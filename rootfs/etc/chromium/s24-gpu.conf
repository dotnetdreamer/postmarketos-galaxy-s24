# Galaxy S24 postmarketOS (Claude, 2026-11-15), sourced by Alpine's Chromium launcher after
# chromium.conf. Chromium uses the GPU (OpenGL ES via ANGLE -> Mesa zink -> the Xclipse Vulkan
# driver) for compositing, scrolling, animations, WebGL, WebGPU and video. Two GPU paths draw wrong
# on this stack and stay on the CPU, which keeps up on these cores:
#  - GPU rasterization: Skia's GPU path rendering breaks complex shapes (stars, arcs, curved and
#    dashed strokes come out in pieces)
#  - accelerated 2D canvas: same, and reading a GPU canvas back returns black
# Measured in a headless GPU session: WebGL 55 fps either way; 2D canvas 56 fps on the CPU vs 55
# on the GPU. Chromium keeps its own sandbox (setuid chrome-sandbox + seccomp) here.
CHROMIUM_FLAGS="$CHROMIUM_FLAGS --disable-gpu-rasterization --disable-accelerated-2d-canvas"
