# /etc/chromium/s24-phone-fit.conf, read by /usr/bin/chromium (the Alpine wrapper) on every start.
# Galaxy S24, postmarketOS (Claude, 2026-11-16): Chromium's window never goes below 500 px, so on
# the 393 px phone screen it draws itself smaller to fit (0.75 there); a wider screen is left
# alone. The rule lives in /usr/local/bin/s24-fit, shared with Brave, VS Code and Podman Desktop.
# Delete this file to undo for Chromium.
_s24_fit=$(/usr/local/bin/s24-fit flag 500 2>/dev/null)
[ -n "$_s24_fit" ] && CHROMIUM_FLAGS="$CHROMIUM_FLAGS $_s24_fit"
unset _s24_fit
