# Galaxy S24 screen-off power settings, read by s24-powerd when it starts.
# After a change: rc-service s24-power restart (as root)

# a double tap on the dark screen turns it on: 1 = yes, 0 = no
double_tap_wake=1

# ignore a double tap while the proximity sensor is covered (in a pocket, face down): 1 = yes, 0 = no
pocket_check=1

# deep sleep while the screen is dark: 1 = yes, 0 = stay awake
# (it never sleeps while sound plays, an SSH session is open or a computer's USB data cable is in)
autosleep=1

# seconds the screen must be dark before the phone sleeps
sleep_delay=5

# seconds it stays awake after something other than you woke it (a message, the network)
wake_grace=3
