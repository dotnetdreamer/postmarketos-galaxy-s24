# /etc/containers/containers.conf.d/s24-network.conf (Claude, 2026-11-15)
# netavark 2.1 only offers nftables or no firewall, and this kernel has no nftables: container
# networks (podman network create, compose) still get bridges, addresses and DNS between
# containers; outbound NAT comes from the s24-podman-nat service (legacy iptables); ports can't be
# published on them (use the default host network for that).
[network]
firewall_driver = "none"
