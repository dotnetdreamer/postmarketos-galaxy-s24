# /etc/containers/containers.conf.d/s24.conf (Claude, 2026-11-15)
# The Galaxy S24 runs Samsung's 6.1 Android kernel, built without PID, IPC and user
# namespaces, SysV IPC, the pids cgroup controller and nftables. So containers share the
# phone's PID, IPC and network namespaces (they still get their own filesystem, hostname
# and cgroup namespace), there is no pids limit, and podman runs as root (no rootless).
[containers]
pidns = "host"
ipcns = "host"
netns = "host"
pids_limit = 0
