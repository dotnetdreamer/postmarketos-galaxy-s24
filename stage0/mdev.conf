# Galaxy S24 stage-0 (Claude, 2026-11-14): device node permissions for the mdev loop (the kernel has
# no devtmpfs and nothing else creates /dev). Without this mdev makes every node 0660 root:root
# again every 2 s, and non-root users cannot even open /dev/null (dbus, greetd, Phosh all fail).
# Group ids are postmarketOS': tty 5, disk 6, kmem 9, audio 18, dialout 20, input 23, video 27,
# kvm 34, render 996. mdev matches the whole DEVNAME, subdirectory included (dri/card1).
null		0:0 666
zero		0:0 666
full		0:0 666
random		0:0 666
urandom		0:0 666
tty		0:5 666
ptmx		0:5 666
fuse		0:0 666
console		0:5 600
kmem		0:9 640
mem		0:9 640
ttyGS[0-9]*	0:20 660
ttySAC[0-9]*	0:20 660
(input/)?event[0-9]+	0:23 660
(input/)?mice	0:23 660
(input/)?mouse[0-9]+	0:23 660
uinput		0:23 660
(dri/)?card[0-9]+	0:27 660
(dri/)?renderD[0-9]+	0:996 666
kvm		0:34 660
sd[a-z][0-9]*	0:6 660
rtc[0-9]+	0:0 664
(snd/)?pcm.*	0:18 660
(snd/)?control.*	0:18 660
(snd/)?timer	0:18 660
